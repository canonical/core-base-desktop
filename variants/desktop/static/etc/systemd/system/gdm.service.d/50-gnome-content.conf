[Service]
AppArmorProfile=gdm
ExecStartPre=
ExecStartPre=/usr/libexec/gnome-content-launch --content /snap/gnome-desktop-runtime/current/usr/share/gdm/generate-config
ExecStart=
ExecStart=/usr/libexec/gnome-content-launch --content /snap/gnome-desktop-runtime/current/usr/sbin/gdm3
ExecReload=
ExecReload=/usr/libexec/gnome-content-launch --content /snap/gnome-desktop-runtime/current/usr/share/gdm/generate-config
ExecReload=/bin/kill -SIGHUP $MAINPID
