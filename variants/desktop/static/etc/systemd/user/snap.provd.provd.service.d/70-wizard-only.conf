[Unit]
# snapd enables the user-scope daemon globally (default.target.wants for
# every user manager: the gdm greeter, real users, root). Only the
# transient first-boot wizard user - primary group gnome-initial-setup,
# created by GDM for the initial-setup session - runs the wizard backend.
# Inverse of the proven 70-gdm-skip pattern used by the session units.
ConditionGroup=gnome-initial-setup

[Service]
# Belt for the session bus address: systemd --user normally exports it,
# but provd's dconf/gsettings path is dead without it, so pin it to the
# user runtime dir explicitly (%t = /run/user/<uid> in user units).
Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=%t/bus
