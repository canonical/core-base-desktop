[Unit]
# snapd enables the user-scope daemon globally (default.target.wants for
# every user manager: the gdm greeter, real users, root). Only the
# transient first-boot wizard user - primary group gnome-initial-setup,
# created by GDM for the initial-setup session - runs the wizard backend.
# Inverse of the proven 70-gdm-skip pattern used by the session units.
ConditionGroup=gnome-initial-setup

[Service]
# Belt for the session bus address: systemd --user normally exports it,
# but provd's dconf/gsettings path is dead without it, so pin it to the
# user runtime dir explicitly (%t = /run/user/<uid> in user units).
Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=%t/bus
# provd reads the wizard session's accessibility state through its own
# dconf client, and each snap gets its own XDG_CONFIG_HOME (snapd's
# per-snap redirect) - provd's would be its own common dir, while the
# session's dconf database lives behind the session snap's redirect
# (the dbus-activated dconf-service writes
# $SNAP_USER_COMMON/.config/dconf/user of ubuntu-desktop-session). Point
# provd's config home at the session snap's common dir so its reads see
# the state the session writes (the chord's screen-reader flip, the
# accessibility page's toggles); the wizard->user handover records what
# this view says. Same cross-snap contract the handover unit documents.
Environment=XDG_CONFIG_HOME=%h/snap/ubuntu-desktop-session/common/.config
