# Runtime directory for the first-boot wizard (provd socket + the UI's
# $HOME/.cache): GDM allocates a different dynamic UID for each
# initial-setup session, so keep the parent world-writable with a sticky
# bit. The desktop-provision subdirectory is ALSO pre-created here: provd
# is a user-scope snap daemon in Phase B and may start (and bind its
# socket) before gnome-initial-setup.service's launcher runs, so the
# directory must already exist at boot rather than being created by the
# launcher as the session user. /run is tmpfs, so these d lines run and
# re-assert the modes on every boot (parity with the fat base's
# usr/lib/tmpfiles.d/gnome-initial-setup.conf; without them provd can
# never create its socket - non-root mkdir under /run is EPERM).
d /run/gnome-initial-setup 1777 root root -
d /run/gnome-initial-setup/desktop-provision 1777 root root -
