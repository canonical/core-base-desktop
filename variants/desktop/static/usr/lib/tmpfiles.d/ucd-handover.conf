# The wizard->user accessibility handover channel (see
# writable.conf.d/desktop.conf and ucd-a11y-handover.service).
#
# dconf's system config dir (/etc/dconf, a writable-storage bind) must
# stay root-only: unprivileged users must not be able to plant profiles
# or dbs into it. provd - running as the wizard session's dynamic uid,
# whose only group is gnome-initial-setup - records the handover in the
# channel subdir below. The subdir is group-writable for the
# provisioning group only; every other user can TRAVERSE it (others=x)
# but not list or create anything in it - the applying side runs in the
# TARGET user's session manager, which is not in the provisioning
# group, and reads the two recorded files by exact path (the files
# themselves are 0644). The session unit that applies the handover
# re-verifies the directory and file modes before applying anything.
#
# Mode and ownership are re-applied on every boot even when the
# directories already exist, so a drifted directory cannot reopen the
# channel (the apply side still fail-closes on a wrong mode).
d /etc/dconf 0755 root root - -
d /etc/dconf/channel 0755 root root - -
d /etc/dconf/channel/handover 1731 root gnome-initial-setup - -
