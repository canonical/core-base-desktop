[Unit]
# Pull the boot-time accessibility mirror in with the display manager (the
# gdm-homedirs pattern): the mirror must complete before the greeter
# renders, or the greeter starts with an unseeded dconf store and renders
# silent even when the user's latest preference has the reader on.
Requires=ucd-a11y-greeter-mirror.service
After=ucd-a11y-greeter-mirror.service
