[Service]
# Dispatch the wizard session's manager to the confined session snap,
# mirroring gnome-session-manager@ubuntu.service.d. The confined shell
# creates its wayland socket under the snap-private runtime dir; the
# session snap's environment-broker (called by this snap's patched
# gnome-session) rewrites WAYLAND_DISPLAY to the absolute socket path
# in the manager + activation env, which is what lets the unconfined
# wizard UI (ubuntu_init) and orca.service find the display.
ExecStart=
ExecStart=/usr/libexec/gnome-content-launch --session-dispatch gnome-session-service --session=%i
