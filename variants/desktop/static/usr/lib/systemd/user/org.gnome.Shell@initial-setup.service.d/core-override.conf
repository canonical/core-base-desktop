[Service]
# Dispatch the wizard session's shell to the confined session snap,
# mirroring org.gnome.Shell@ubuntu.service.d. Without this the wizard
# shell runs the gnome-desktop-runtime content binary raw (the
# gnome-content-launch alias branch), so every same-snap dbus handshake
# (gsd-media-keys GrabAccelerators, orca's KeyboardMonitor, the a11y
# Manager) crosses an unconfined-peer boundary the same-snap template
# rules do not cover. Unlike @gdm there is NO --no-x11: the wizard
# keeps mutter's on-demand Xwayland (the session snap ships the
# xwayland/xkbcomp launchers and the xkb data layout).
ExecStart=
ExecStart=/usr/libexec/gnome-content-launch --session-dispatch gnome-shell --mode=%i
