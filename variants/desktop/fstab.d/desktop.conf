
# Desktop variant writable mounts (see variants/README.md); mirrors
# the writable-mount additions of the core26-desktop base.
/writable/system-data/etc/colord /etc/colord none bind,x-initrd.mount 0 0
/writable/system-data/var/lib/AccountsService /var/lib/AccountsService none bind 0 0
/writable/system-data/var/lib/gdm3 /var/lib/gdm3 none bind 0 0
/writable/system-data/usr/share/wayland-sessions /usr/share/wayland-sessions none bind 0 0
/writable/system-data/usr/share/polkit-1 /usr/share/polkit-1 none bind 0 0
/writable/system-data/var/lib/colord /var/lib/colord none bind 0 0
/writable/system-data/var/lib/fprint /var/lib/fprint none bind 0 0
# Firefox policy
/writable/system-data/etc/firefox /etc/firefox none bind,x-initrd.mount 0 0
tmpfs /var/cache/colord tmpfs mode=0755,nodev,nosuid,noexec 0 0
