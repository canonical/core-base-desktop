# snapd tree entries that must exist in the writable layer even when
# the factory C copy of /var/lib/snapd (core-writable.conf) is skipped.
#
# On first boot snapd's initrd creates /writable/system-data/var/lib/
# snapd itself (writable defaults / kernel drivers tree materialized
# from _writable_defaults) before initrd-core-tmpfiles-setup runs, and
# systemd-tmpfiles never populates an already-existing destination, so
# the C line for /var/lib/snapd can silently no-op and the factory
# skeleton never lands. snapd recreates most of its tree at runtime,
# but not the entries below:
# - void (mode 0111) is packaging-only; snapd never creates it, and
#   non-root `snap run` fails without it (T4.1 fresh-boot finding).
# - cache is snapd's store downloads cache dir ("cannot clean store
#   downloads cache" otherwise).
# - lib/{gl,gl32,glvnd,vulkan} are the GL/GLVnd/Vulkan redirection
#   targets referenced by the opengl interface and snap LD_LIBRARY_PATH.
# These d lines are idempotent: they run after the C line in file
# order, only create what is missing, and re-assert the modes (void
# must stay 0111).
d /writable/system-data/var/lib/snapd/void 0111 root root - -
d /writable/system-data/var/lib/snapd/cache 0755 root root - -
d /writable/system-data/var/lib/snapd/lib/gl 0755 root root - -
d /writable/system-data/var/lib/snapd/lib/gl32 0755 root root - -
d /writable/system-data/var/lib/snapd/lib/glvnd 0755 root root - -
d /writable/system-data/var/lib/snapd/lib/vulkan 0755 root root - -
