
# Desktop variant writable paths (see variants/README.md); mirrors the
# core-writable.conf additions of the core26-desktop base. Each C
# line's factory template is copied from the rootfs itself by
# hooks-build/100-factory-files.build, and each path needs its fstab
# entry (fstab.d/desktop.conf) and mount point (static/ below); the
# 993-factory-files test gates this at build time.
C /writable/system-data/etc/colord
C /writable/system-data/var/lib/AccountsService
C /writable/system-data/var/lib/gdm3
C /writable/system-data/usr/share/wayland-sessions
C /writable/system-data/usr/share/polkit-1
C /writable/system-data/var/lib/colord
C /writable/system-data/var/lib/fprint
# Firefox policy
C /writable/system-data/etc/firefox
