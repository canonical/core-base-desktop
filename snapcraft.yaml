      - language-pack-gnome-cy-base
      - language-pack-gnome-da-base
      - language-pack-gnome-de-base
      - language-pack-gnome-dz-base
      - language-pack-gnome-el-base
      - language-pack-gnome-en-base
      - language-pack-gnome-eo-base
      - language-pack-gnome-es-base
      - language-pack-gnome-et-base
      - language-pack-gnome-eu-base
      - language-pack-gnome-fa-base
      - language-pack-gnome-fi-base
      - language-pack-gnome-fr-base
      - language-pack-gnome-fur-base
      - language-pack-gnome-gd-base
      - language-pack-gnome-gl-base
      - language-pack-gnome-gu-base
      - language-pack-gnome-he-base
      - language-pack-gnome-hi-base
      - language-pack-gnome-hr-base
      - language-pack-gnome-hu-base
      - language-pack-gnome-id-base
      - language-pack-gnome-is-base
      - language-pack-gnome-it-base
      - language-pack-gnome-ja-base
      - language-pack-gnome-ka-base
      - language-pack-gnome-kab-base
      - language-pack-gnome-kk-base
      - language-pack-gnome-km-base
      - language-pack-gnome-kn-base
      - language-pack-gnome-ko-base
      - language-pack-gnome-ku-base
      - language-pack-gnome-lt-base
      - language-pack-gnome-lv-base
      - language-pack-gnome-mk-base
      - language-pack-gnome-ml-base
      - language-pack-gnome-mr-base
      - language-pack-gnome-ms-base
      - language-pack-gnome-my-base
      - language-pack-gnome-nb-base
      - language-pack-gnome-nds-base
      - language-pack-gnome-ne-base
      - language-pack-gnome-nl-base
      - language-pack-gnome-nn-base
      - language-pack-gnome-oc-base
      - language-pack-gnome-or-base
      - language-pack-gnome-pa-base
      - language-pack-gnome-pl-base
      - language-pack-gnome-pt-base
      - language-pack-gnome-ro-base
      - language-pack-gnome-ru-base
      - language-pack-gnome-si-base
      - language-pack-gnome-sk-base
      - language-pack-gnome-sl-base
      - language-pack-gnome-sq-base
      - language-pack-gnome-sr-base
      - language-pack-gnome-sv-base
      - language-pack-gnome-szl-base
      - language-pack-gnome-ta-base
      - language-pack-gnome-te-base
      - language-pack-gnome-tg-base
      - language-pack-gnome-th-base
      - language-pack-gnome-tr-base
      - language-pack-gnome-ug-base
      - language-pack-gnome-uk-base
      - language-pack-gnome-vi-base
      - language-pack-gnome-xh-base
      - language-pack-gnome-zh-hans-base
      - language-pack-gnome-zh-hant-base
    override-build: |
      # See desktop-packages' override-build above for why this
      # relocation is needed.
      tmpdir="$(mktemp -d)"
      mv "${CRAFT_PART_INSTALL}"/* "$tmpdir"/
      mkdir -p "${CRAFT_PART_INSTALL}"/base
      mv "$tmpdir"/* "${CRAFT_PART_INSTALL}"/base/
      rmdir "$tmpdir"

      # Resolve any overlap with chisel-libs (locale data, etc.) - see
      # tools/resolve-base-conflicts.sh.
      "${CRAFT_PROJECT_DIR}"/tools/resolve-base-conflicts.sh "${CRAFT_PART_INSTALL}"/base
    override-prime: |
      # No files from this step in prime

  snapd-files:
    plugin: nil
    source: .
    build-packages:
      - snapd
    after:
      - chisel-libs
    override-build: |
      mkdir -p "${CRAFT_PART_INSTALL}"/base/usr/lib/systemd/system-generators
      cp /usr/lib/systemd/system-generators/snapd-generator "${CRAFT_PART_INSTALL}"/base/usr/lib/systemd/system-generators/snapd-generator
      mkdir -p "${CRAFT_PART_INSTALL}"/base/usr/lib/tmpfiles.d
      cp /usr/lib/tmpfiles.d/snapd.conf "${CRAFT_PART_INSTALL}"/base/usr/lib/tmpfiles.d/snapd.conf
    override-prime: |
      # No files from this step in prime

  generators:
    plugin: nil
    source: generators/
    build-packages:
      - cargo
      - rustc
    override-build: |
      cd "${CRAFT_PART_SRC}"
      cargo build --release
      strip target/release/ubuntu-core-generator
      mkdir -p "${CRAFT_PART_INSTALL}/usr/lib/core"
      install -m 755 target/release/ubuntu-core-generator \
        "${CRAFT_PART_INSTALL}/usr/lib/core/ubuntu-core-generator"

  splash-theme:
    plugin: dump
    source: https://github.com/snapcore/plymouth-theme-ubuntu-core.git
    source-type: git
    organize:
      ubuntu-core: usr/share/plymouth/themes/ubuntu-core
      copyright: usr/share/doc/plymouth-theme-ubuntu-core/copyright
    stage:
      - -README.md

  fuse-broker:
    plugin: nil
    source: fuse-broker/
    build-packages:
      - golang
    override-build: |
      cd "${CRAFT_PART_SRC}"
      CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o xdg-fuse-broker .
      mkdir -p "${CRAFT_PART_INSTALL}/base/usr/bin"
      install -m 755 xdg-fuse-broker "${CRAFT_PART_INSTALL}/base/usr/bin/xdg-fuse-broker"
    override-prime: |
      # No files from this step in prime; the hooks part flattens
      # ${CRAFT_STAGE}/base into the snap root.

  hooks:
    after:
      - chisel-libs
      - desktop-packages
      - gdm-packages
      - gnome-desktop-components
      - xdg-desktop-portal-patched
      - system-setup-tool-packages
      - locale-packages
      - snapd-files
      - splash-theme
      - fuse-broker
      - build-env
    plugin: make
    source: .
    build-packages:
      - shellcheck
      - distro-info
      - dconf-cli
    override-prime: |
      craftctl default

      # ensure build-in tests are run
      make -C ${CRAFT_PART_SRC} test TESTDIR=${CRAFT_PRIME}

  generate-changelog:
    after:
      - hooks
    plugin: make
    # Use the root to be able to detect the git repo, as we need to be able
    # to get the current commit
    source: .
    build-packages:
      - python3-yaml
    override-build: |
      cd ${CRAFT_PART_SRC}

      # Generate the dpkg.yaml for compatability purposes. Scanning tools still expect
      # this file to be present, and they move slowly in terms of support for the new chisel format.
      mkdir -p "${CRAFT_PART_INSTALL}/usr/share/snappy"
      python3 ./tools/wall2dpkg.py "${CRAFT_STAGE}/var/lib/chisel/manifest.wall" "${CRAFT_PART_INSTALL}/usr/share/snappy/dpkg.yaml"

      # Package-level changelog generation (tools/generate-changelog.py) is
      # disabled here. It works by diffing this image's package manifest
      # against core26's currently-published manifest, and for every
      # package whose version differs, pulling in that package's own
      # upstream changelog - but only for packages explicitly whitelisted,
      # since it has no local copy of any package's changelog to fall back
      # on (chisel doesn't ship doc slices) and downloading one for every
      # differing package on every build isn't desirable. This desktop
      # image pulls in a whole additional package stack on top of core26,
      # so there's nothing meaningfully different about the handful of
      # packages that happen to trip this today (e.g. netplan, polkit)
      # versus the hundreds of others that don't - whitelisting them isn't
      # justified. This is expected to go away once the desktop-specific
      # packages move out of this base into separate snaps built on top
      # of plain core26, at which point core26's own changelog generation
      # applies unmodified again.
      echo "WARNING: changelog generation is disabled for this build"

  publish-artifacts-lp:
    after:
      - generate-changelog
    plugin: nil
    override-prime: |
      # copy dpkg.yaml, chisel manifest and changelog files for lp build
      if [ -e /build/core26 ]; then
        DATEFMT="$(date +%Y%m%d%H%M)"
        /bin/cp ${CRAFT_PRIME}/usr/share/snappy/dpkg.yaml /build/core26/core26-$(DATEFMT)_${CRAFT_ARCH_BUILD_FOR}.dpkg.yaml
        /bin/cp ${CRAFT_PRIME}/var/lib/chisel/manifest.wall /build/core26/core26-$(DATEFMT)_${CRAFT_ARCH_BUILD_FOR}.manifest.wall
        # changelog generation is disabled (see generate-changelog part), so
        # ChangeLog is never present here - only copy it if it exists.
        if [ -e ${CRAFT_PRIME}/usr/share/doc/ChangeLog ]; then
          /bin/cp ${CRAFT_PRIME}/usr/share/doc/ChangeLog /build/core26/core26-$(DATEFMT)_${CRAFT_ARCH_BUILD_FOR}.ChangeLog
        fi
      fi
