name: core26-desktop
adopt-info: build-env
summary: Runtime environment based on Ubuntu 26.04
description: |
  The base snap based on the Ubuntu 26.04 release.
confinement: strict
type: base
build-base: core26
grade: stable
assumes:
  - snapd2.55.5
  # This is uncommented in our github builds for riscv64
  ## - isa-riscv64-rva23

platforms:
  amd64:
  arm64:

# NOTE: the old apt-based hooks (pre-chisel) enabled the desktop-snappers
# PPA (core-desktop) here to get GDM/GNOME session packages. It's
# deliberately NOT enabled yet: none of the packages this item adds
# (im-config, libspa-0.2-bluetooth, xdg-utils, xkb-data) actually need
# it, they're all in the regular resolute archive. Checked the PPA's real
# published suites (http://ppa.launchpad.net/desktop-snappers/core-desktop
# /ubuntu/dists/) - it only has focal/jammy/kinetic/mantic/noble, and its
# "devel" alias is a stale pointer at noble from Sep 2024, never
# rebuilt for resolute/core26. So pulling from it now would mean lacing a
# resolute-based rootfs with noble-ABI binaries - a real compatibility
# risk, not just a local-network limitation. Revisit this (add
# package-repositories with a `suites: [noble]` pin like before, accepting
# the mismatch, or find/request a resolute build) whichever later item
# in this rebase first needs a package that's genuinely only in this PPA.

parts:
  build-env:
    plugin: nil
    # To retrigger the pull step automatically on changes.
    source: .
    override-pull: |
      # We use a file with env vars in $CRAFT_PROJECT_DIR to decide whether to
      # include cloud-init or not. This file can be manually created for local
      # builds, or created here if we are running from a launchpad recipe with
      # suffix -cloud-init. This is detected by looking at the
      # SNAPCRAFT_IMAGE_INFO env var injected in LP, which tells us the build
      # url and has a form like:
      #
      # {
      #   "build-request-id": "lp-<id>",
      #   "build-request-timestamp": "<time>",
      #   "build_url": "https://launchpad.net/~ubuntu-core-service/+snap/core26-cloud-init/+build/<build_id>"
      # }
      #
      # (although in one line).
      if ! [ -e "$CRAFT_PROJECT_DIR"/build-env ]; then
        (
            cd "${CRAFT_PART_SRC}"
            touch build-env
            # parse the snap name from the url, and remove the prefix "core26-" and 
            # suffix "/+build" to get the variant name, if any.
            if [ -n "${SNAPCRAFT_IMAGE_INFO+x}" ]; then
              SNAP_BUILD_VARIANT=$(printf '%s' "$SNAPCRAFT_IMAGE_INFO" | grep -oP '(?<=core26-)[^/]*(?=/\+build)' || true)
              if [ -n "$SNAP_BUILD_VARIANT" ]; then
                  echo "SNAP_BUILD_VARIANT=$SNAP_BUILD_VARIANT" > build-env
              fi
            fi
        )
      else
        # copy to install dir so that we can use it in the build step
        cp "$CRAFT_PROJECT_DIR"/build-env "${CRAFT_PART_SRC}"/build-env
      fi

      date_tag=$("$CRAFT_PROJECT_DIR"/get-version.sh)

      # make sure we load the build-env here, especially if we're using
      # the locally sourced one.
      . "${CRAFT_PART_SRC}"/build-env
      SNAP_BUILD_VARIANT=${SNAP_BUILD_VARIANT:-}

      # handle build variants
      if [ -n "$SNAP_BUILD_VARIANT" ]; then
        craftctl set version="${date_tag}+$SNAP_BUILD_VARIANT"
        echo "SNAP_BUILD_NAME=core26-$SNAP_BUILD_VARIANT" >> "${CRAFT_PART_SRC}"/build-env
      else
        craftctl set version="${date_tag}"
        echo "SNAP_BUILD_NAME=core26" > "${CRAFT_PART_SRC}"/build-env
      fi
    override-build: |
      cp "${CRAFT_PART_SRC}"/build-env "${CRAFT_PART_INSTALL}"/build-env
    prime:
      - -build-env

  # TODO: rewrite this once all slices are upstreamed to use chisel slices
  # directly from canonical, instead of our own chisel-releases repo.
  chisel-libs:
    after:
      - build-env
    plugin: nil
    build-packages:
      - golang
      - file
    source: https://github.com/canonical/chisel-ubuntu-core.git
    source-type: git
    source-branch: '26.04'
    override-build: |
      go install github.com/canonical/chisel/cmd/chisel@latest
      
      # Define the system utilities that we want to include in the base
      # These are the ones where we can probably slim down the number of binaries
      # later on, but for now we include them all to ensure maximum compatibility.
      UTILS=(
        apparmor_bins
        bash_bins
        bzip2_scripts
        coreutils-from-uutils_bins
        diffutils_bins
        dosfstools_bins
        debianutils_which
        debianutils_ischroot
        debianutils_run-parts
        file_bins
        gdbserver_bins
        gnu-coreutils_bins
        gnutls-bin_bins
        gpgv_bins
        grep_bins
        gzip_scripts
        hostname_bins
        iptables_bins
        iputils-ping_bins
        less_bins
        login_bins
        mawk_bins
        ncurses-bin_bins
        polkitd_bins
        rfkill_bins
        sed_bins
        sudo-rs_bins
        sysvinit-utils_scripts
        squashfs-tools_bins
        tar_bins
        util-linux_bins
        util-linux_nsenter
        util-linux-extra_pivot-root
        util-linux-extra_hardware
        util-linux-extra_process
        util-linux-extra_login
        vim-tiny_bins
      )

      # Define the system libraries and services that we want to include in the base
      # 
      SLICES=(
        apparmor_systemd
        base-files_motd
        base-files_release-info
        base-files_root-defaults
        bash-completion_config
        bash-completion_completions
        ca-certificates_data-with-certs
        cracklib-runtime_bins
        cryptsetup_bins
        cryptsetup-bin_bins
        dbus_services
        dbus-user-session_services
        dhcpcd-base_standard
        distro-info-data_data
        dmsetup_rules
        e2fsprogs_services
        e2fsprogs_standard
        fdisk_bins
        fonts-ubuntu_all
        fonts-ubuntu_config
        finalrd_services
        iproute2_bins
        kmod_bins
        kmod_config

        libc6_config
        libc6_gconv
        libc-bin_iconv
        libc-bin_nsswitch
        libc-bin_ldconfig
        libc-bin_locale
        libc-bin_getconf
        libc-bin_getent

        libpam-modules_config
        libpam-modules_pam-config
        libpam-pwquality_pam-config
        libpam-modules-bin_standard
        libpam-modules-bin_extrausers
        libpam-modules-bin_namespace
        libpam-modules-bin_timestamp
        libpam-systemd_libs
        libengine-pkcs11-openssl_libs
        libgnutls30t64_config
        libopts25_libs
        libp11-3t64_libs
        libnss-mdns_mdns4-minimal
        libnss-extrausers_libs
        libpam-pwquality_libs
        libpciaccess0_libs
        libwrap0_host-files
        libx11-data_xerrordb
        locales_standard

        netcat-openbsd_bins
        netplan.io_bins
        ncurses-base_terminfo

        openssh-client_config
        openssh-client_services
        openssh-server_bins
        openssh-server_config
        openssh-server_services
        openssl_bins
        opensc_bins
        p11-kit_bins
        passwd_pam-config
        polkitd_services
        procps_bins
        plymouth_bins
        plymouth-label-ft_libs
        procps_config

        udev_services
        util-linux_services
        systemd_bash-completions
        systemd_extras
        systemd_run0
        systemd_kernel-parameters
        systemd_udev-rules
        systemd_tpm2
        systemd_standard
        systemd_user-services
        systemd-bootchart_services
        systemd-coredump_bins
        systemd-cryptsetup_bins
        systemd-cryptsetup_services
        systemd-resolved_bins
        systemd-sysv_bins
        systemd-timesyncd_services
        systemd-zram-generator_services
        
        tzdata_zoneinfo
        wpasupplicant_services
      )

      . "$CRAFT_STAGE"/build-env
      SNAP_BUILD_VARIANT=${SNAP_BUILD_VARIANT:-}
      if [ "$SNAP_BUILD_VARIANT" = cloud-init ]; then
          SLICES+=(cloud-init_bins)
      fi

      # TODO: not sure about FIPS yet, this will have to come later, chisel has builtin
      # support for ESM, meaning it's something we can request chisel to do for us.
      # if [ "$SNAP_BUILD_VARIANT" = fips ]; then
      #   # Ensure vital crypt packages are refreshed / downgraded and downloaded
      #   # from the FIPS ppa. This should also contain openssh-server, but we already
      #   # have that one listed above.
      #   SLICES+=(libgcrypt20 libgnutls30t64 openssl-fips-module-3 ssh)
      # fi
      
      # add architecture specific slices
      case "$(dpkg --print-architecture)" in
          amd64|arm64)
              SLICES+=(secureboot-db_services nvidia-kernel-common-595_bins nvidia-kernel-common-595_modprobe-d-kms)
              ;;
          i386)
              SLICES+=(secureboot-db_services)
              ;;
          riscv64)
              SLICES+=(gdbserver_bins systemd-bootchart_services)
              ;;
      esac

      # create the rootfs directory we install slices into
      mkdir -p "${CRAFT_PART_INSTALL}"/base

      # Cut the initial slices into the rootfs
      chisel cut \
        --release="${CRAFT_PART_SRC}" \
        --root "${CRAFT_PART_INSTALL}"/base \
        "${SLICES[@]}" "${UTILS[@]}" \
        base-files_chisel

      # Cut foreign libraries we also need
      case "$(dpkg --print-architecture)" in
          amd64)
              chisel cut \
                --arch=i386 \
                --release="${CRAFT_PART_SRC}" \
                --root "${CRAFT_PART_INSTALL}"/base \
                libnss-mdns_mdns4-minimal libc6_libs libc6_gconv libc6_config libgcc-s1_libs
              ;;
      esac
      
      # https://documentation.ubuntu.com/chisel/en/latest/reference/manifest/
      # chisel automatically generates a manifest for the cut slices here:
      # $rootfs/var/lib/chisel/manifest.wall
      # this is zstd compressed, and must therefor be uncompressed
      # unzstd ./manifest.wall -o manifest.json

      # We cut both coreutils-from-uutils_bins and gnu-coreutils_bins
      # above (see the UTILS array) - Ubuntu 26.04 defaults to the
      # uutils (Rust) coreutils reimplementation for the plain utility
      # names (install, chmod, mkdir, ...), with the real GNU binaries
      # only available under a gnu-prefixed name (gnuinstall, gnuchmod,
      # gnumkdir, ...) to avoid a filename clash between the two
      # slices. Unlike GNU coreutils, uutils' `install -d`
      # unconditionally chmod()s the target directory even when it
      # already exists, which fails with EROFS on paths that are still
      # part of the read-only base squashfs at boot (e.g. gdm3's
      # ExecStartPre calls `install -d /var/lib`, breaking gdm.service
      # on every boot - see todo-gnome-session.txt for the original
      # investigation). Repoint every plain utility name that has a
      # gnu-prefixed counterpart at that GNU binary instead, matching
      # the behaviour the rest of the image (and the
      # writable-paths/fstab bind-mount design) assumes.
      rootfs="${CRAFT_PART_INSTALL}"/base
      for gnu_bin in "$rootfs"/usr/bin/gnu*; do
        [ -e "$gnu_bin" ] || continue
        name="$(basename "$gnu_bin")"
        plain="${name#gnu}"
        target="$rootfs/usr/bin/$plain"
        if [ -L "$target" ] || [ -e "$target" ]; then
          rm -f "$target"
          ln -s "$name" "$target"
        fi
      done
      if [ "$(readlink "$rootfs/usr/bin/install")" != "gnuinstall" ]; then
        echo "coreutils switch to GNU did not take effect for install" >&2
        exit 1
      fi

    override-prime: |
      # No files from this step in prime

  desktop-packages:
    # Packages needed for GDM/GNOME session support that come from the
    # regular Ubuntu archive (or the desktop-snappers PPA, once later
    # commits add packages that actually need it) rather than as chisel
    # slices - chisel-ubuntu-core has no slice definitions for desktop
    # packages like these, so they're fetched as ordinary .debs via
    # snapcraft's own stage-packages mechanism instead.
    after:
      - chisel-libs
    plugin: nil
    stage-packages:
      - im-config
      - libspa-0.2-bluetooth
      - xdg-utils
      - xkb-data
    override-build: |
      # stage-packages are already fetched and unpacked into
      # CRAFT_PART_INSTALL at this point (in their normal filesystem
      # layout, e.g. usr/bin/...). Relocate all of it under base/ so it
      # merges with the chisel-libs part's own base/ output once staged -
      # the hooks part's `cp -a $(CRAFT_STAGE)/base $(DESTDIR)` step only
      # picks up the base/ subdirectory of the aggregate stage.
      tmpdir="$(mktemp -d)"
      mv "${CRAFT_PART_INSTALL}"/* "$tmpdir"/
      mkdir -p "${CRAFT_PART_INSTALL}"/base
      mv "$tmpdir"/* "${CRAFT_PART_INSTALL}"/base/
      rmdir "$tmpdir"

      # chisel-libs (this part's declared "after" dependency, already
      # staged into ${CRAFT_STAGE} by this point) can ship files under
      # the same path as a package staged here - e.g. its
      # libx11-data_xerrordb slice already pulls in xkeyboard-config-2
      # as a transitive dependency and creates usr/share/X11/xkb itself
      # (at the wrong depth - see the Makefile's `install` target for
      # the real fix-up), which conflicts with xkb-data's own copy
      # above. See tools/resolve-base-conflicts.sh for how this (and
      # any other part/chisel-libs overlap) is resolved generically.
      "${CRAFT_PROJECT_DIR}"/tools/resolve-base-conflicts.sh "${CRAFT_PART_INSTALL}"/base
    override-prime: |
      # No files from this step in prime

  gdm-packages:
    # First half of the original apt-get-in-a-hook package list from
    # hooks/002.1-add-gdm.chroot (pre-chisel): GDM itself, Xwayland, audio
    # (pulseaudio-utils/alsa-utils), gsound, ibus, and the Yaru theme.
    #
    # Stop bundling pipewire/wireplumber/pipewire-pulse in the base
    # image (item 13 of the rebase): sessions bring their own PipeWire
    # via the pipewire content snap now, and
    # static/usr/bin/core-desktop-session-wrapper.sh symlinks the
    # session's PipeWire/PulseAudio sockets from that snap instead of
    # the desktop session snap. Only pipewire-bin's /usr/share config is
    # kept (see below), since clients like xdg-desktop-portal still read
    # it directly for screensharing.
    #
    # Left out on purpose because chisel-libs already slices them (see the
    # SLICES array above) - staging the full .deb here would duplicate/
    # conflict with that content:
    #   - polkitd (polkitd_services slice)
    #   - opensc (opensc_bins slice)
    #   - fonts-ubuntu (fonts-ubuntu_all/_config slices)
    #   - locales, locales-all (locales_standard slice already covers
    #     the i18n data/tools chisel needs; item 7's language packs are
    #     staged separately by the locale-packages part below)
    after:
      - chisel-libs
    plugin: nil
    stage-packages:
      - gdm3
      - xwayland
      - libgl1-mesa-dri
      - zenity
      - yaru-theme-gtk
      - yaru-theme-gnome-shell
      - yaru-theme-icon
      - ubuntu-settings
      - xdg-user-dirs
      - pulseaudio-utils
      - alsa-utils
      - libgsound0
      - gsound-tools
      - gir1.2-gsound-1.0
      - libcanberra-pulse
      - libsnapd-glib-2-1
      - ibus
      # pipewire-bin's /usr/share config (needed by clients such as
      # xdg-desktop-portal for screensharing) - everything else from
      # it is stripped below, since sessions bring their own PipeWire
      # server/client daemons via snap (see the "Stop bundling..."
      # comment below for why pipewire/wireplumber/pipewire-pulse
      # themselves aren't staged here at all).
      - pipewire-bin
      # No chisel slice for this; needed at hook-run time for
      # glib-compile-schemas (used to rebuild the schema cache after the
      # wallpaper-default sed edits below). libglib2.0-bin's own
      # /usr/bin/glib-compile-schemas is just a symlink into
      # libglib2.0-0t64's private libexec dir - stage that explicitly
      # too, since nothing else in this part's dependency chain appears
      # to pull the full .deb version of it in (chisel has its own
      # libglib2.0-0t64_bins slice with the same content, but it's not
      # part of chisel-libs' SLICES array above).
      - libglib2.0-bin
      - libglib2.0-0t64
    override-build: |
      # See desktop-packages' override-build above for why this
      # relocation is needed.
      tmpdir="$(mktemp -d)"
      mv "${CRAFT_PART_INSTALL}"/* "$tmpdir"/
      mkdir -p "${CRAFT_PART_INSTALL}"/base
      mv "$tmpdir"/* "${CRAFT_PART_INSTALL}"/base/
      rmdir "$tmpdir"

      # chisel-libs (this part's declared "after" dependency, already
      # staged into ${CRAFT_STAGE} by this point) can ship files under
      # the same path as a package staged here - e.g. gdm3 (most
      # likely, for its config-time scripts) transitively pulls in
      # python3 as a stage-package dependency, which chisel-libs
      # already provides as chisel slices (needed by
      # tools/generate-connections.py, see item 1 of the rebase). See
      # tools/resolve-base-conflicts.sh for how this (and any other
      # part/chisel-libs overlap) is resolved generically.
      "${CRAFT_PROJECT_DIR}"/tools/resolve-base-conflicts.sh "${CRAFT_PART_INSTALL}"/base

      # GDM's dependency chain also stages the portal frontend. Its binary
      # is rebuilt separately from the distro source package below.
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/libexec/xdg-desktop-portal

      # systemd (pulled in transitively, same as usr/sbin/halt et al.
      # above) ships the motd-news "Ubuntu Pro/news" ad banner timer -
      # Ubuntu Core has never wanted this (see
      # hook-tests/016-set-motd.test), so strip it outright rather than
      # relying on it happening to be absent from whichever package
      # transitively pulls it in.
      rm -f "${CRAFT_PART_INSTALL}"/base/etc/default/motd-news
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/lib/systemd/system/motd-news.service
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/lib/systemd/system/motd-news.timer
      rm -f "${CRAFT_PART_INSTALL}"/base/etc/update-motd.d/50-motd-news

      # pipewire-bin: keep only its /usr/share config (still needed by
      # clients such as xdg-desktop-portal for screensharing), strip
      # everything else - the actual PipeWire server/client binaries
      # come from the pipewire content snap at runtime instead.
      #
      # pipewire/wireplumber/pipewire-pulse themselves aren't in
      # stage-packages above at all, but gnome-settings-daemon
      # (Recommends: pipewire-audio -> Depends: pipewire-pulse,
      # wireplumber) and similar transitive pulls from other packages in
      # this part still stage some of their files despite that - unlike
      # apt-get, snapcraft has no dpkg here to `dpkg -r --force-all`
      # them back out with (the original pre-chisel hook's approach), so
      # explicitly strip every file the real .debs for those three
      # packages ship, mirroring what a full package removal would have
      # done.
      find "${CRAFT_PART_INSTALL}"/base/usr/bin -maxdepth 1 \
        \( -name 'pipewire*' -o -name 'pw-*' -o -name 'spa-*' \
           -o -name 'wireplumber' -o -name 'wpctl' -o -name 'wpexec' \) \
        -exec rm -f {} +
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/lib/systemd/user/pipewire*
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/lib/systemd/user/wireplumber*
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/lib/sysusers.d/pipewire.conf
      rm -rf "${CRAFT_PART_INSTALL}"/base/usr/share/wireplumber
      rm -rf "${CRAFT_PART_INSTALL}"/base/usr/share/doc/pipewire
      rm -rf "${CRAFT_PART_INSTALL}"/base/usr/share/doc/pipewire-pulse
      rm -rf "${CRAFT_PART_INSTALL}"/base/usr/share/doc/wireplumber
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/share/apport/package-hooks/source_pipewire.py
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/share/glib-2.0/schemas/org.freedesktop.pulseaudio.gschema.xml
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/share/lintian/overrides/wireplumber
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/share/lintian/overrides/pipewire-pulse
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/share/man/man1/pipewire-pulse.1.gz
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/share/bash-completion/completions/wpctl
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/share/zsh/vendor-completions/_wpctl
      # These are daemon-side plugin modules (loaded only by the
      # pipewire/wireplumber daemons we just removed above) and the
      # wireplumber library itself (only used by that daemon and its Lua
      # scripts, unlike libpipewire-0.3.so which client apps link
      # against directly) - dead weight without the daemon, so drop
      # them too. Client-facing pieces (libpipewire-0.3.so, the
      # gstreamer/ALSA PipeWire plugins) are kept since apps still need
      # them to talk to the content-snap's PipeWire daemon.
      rm -rf "${CRAFT_PART_INSTALL}"/base/usr/lib/*/wireplumber-0.5
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/lib/*/libwireplumber-0.5.so*
      rm -rf "${CRAFT_PART_INSTALL}"/base/usr/lib/*/pipewire-0.3
    override-prime: |
      # No files from this step in prime

  gnome-desktop-components:
    # Second half of the original apt-get-in-a-hook package list from
    # hooks/002.1-add-gdm.chroot (pre-chisel): the actual Ubuntu/GNOME
    # session and its extensions, plus fingerprint/keyring PAM modules.
    #
    # opensc is left out - already covered by chisel-libs' opensc_bins
    # slice, staging the full .deb would duplicate/conflict with it.
    after:
      - chisel-libs
    plugin: nil
    stage-packages:
      - ubuntu-session
      - gkbd-capplet
      - gnome-menus
      - gnome-terminal
      - gnome-settings-daemon
      - gnome-shell-extension-appindicator
      - gnome-shell-extension-desktop-icons-ng
      - gnome-shell-extension-ubuntu-dock
      - gnome-shell-extension-ubuntu-tiling-assistant
      - gnome-control-center
      - gnome-keyring
      - fprintd
      - libpam-fprintd
      - bolt
      - libpam-gnome-keyring
      - spice-vdagent
      - xdg-desktop-portal
      - xdg-desktop-portal-gnome
      - xdg-desktop-portal-gtk
      - xdg-user-dirs-gtk
      - alsa-ucm-conf
    override-build: |
      # See desktop-packages' override-build above for why this
      # relocation is needed.
      tmpdir="$(mktemp -d)"
      mv "${CRAFT_PART_INSTALL}"/* "$tmpdir"/
      mkdir -p "${CRAFT_PART_INSTALL}"/base
      mv "$tmpdir"/* "${CRAFT_PART_INSTALL}"/base/
      rmdir "$tmpdir"

      # Same python3 stage-vs-chisel conflict as gdm-packages above (one
      # of gnome-control-center/gnome-terminal/fprintd's dependencies
      # pulls in python3.14-minimal), plus various other overlaps with
      # chisel-libs (systemd units, coreutils, etc.) - see
      # tools/resolve-base-conflicts.sh for how this is resolved
      # generically.
      "${CRAFT_PROJECT_DIR}"/tools/resolve-base-conflicts.sh "${CRAFT_PART_INSTALL}"/base

      # Keep the Ubuntu package's data, but replace its frontend executable
      # with the patched build from xdg-desktop-portal-patched below.
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/libexec/xdg-desktop-portal

      # See gdm-packages' override-build above for why this is needed.
      rm -f "${CRAFT_PART_INSTALL}"/base/etc/default/motd-news
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/lib/systemd/system/motd-news.service
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/lib/systemd/system/motd-news.timer
      rm -f "${CRAFT_PART_INSTALL}"/base/etc/update-motd.d/50-motd-news

      # This part transitively pulls in pipewire/wireplumber/
      # pipewire-pulse too (gnome-settings-daemon recommends
      # pipewire-audio, which depends on both) even though none of them
      # are declared in stage-packages above - same reasoning and same
      # cleanup as gdm-packages' override-build for item 13 of the
      # rebase: sessions bring their own PipeWire via snap instead. Note
      # pipewire-bin isn't staged by this part at all, so unlike
      # gdm-packages there's no /usr/share content to keep here - strip
      # everything these three packages ship.
      find "${CRAFT_PART_INSTALL}"/base/usr/bin -maxdepth 1 \
        \( -name 'pipewire*' -o -name 'pw-*' -o -name 'spa-*' \
           -o -name 'wireplumber' -o -name 'wpctl' -o -name 'wpexec' \) \
        -exec rm -f {} +
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/lib/systemd/user/pipewire*
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/lib/systemd/user/wireplumber*
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/lib/sysusers.d/pipewire.conf
      rm -rf "${CRAFT_PART_INSTALL}"/base/usr/share/wireplumber
      rm -rf "${CRAFT_PART_INSTALL}"/base/usr/share/pipewire
      rm -rf "${CRAFT_PART_INSTALL}"/base/usr/share/doc/pipewire
      rm -rf "${CRAFT_PART_INSTALL}"/base/usr/share/doc/pipewire-pulse
      rm -rf "${CRAFT_PART_INSTALL}"/base/usr/share/doc/wireplumber
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/share/apport/package-hooks/source_pipewire.py
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/share/glib-2.0/schemas/org.freedesktop.pulseaudio.gschema.xml
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/share/lintian/overrides/wireplumber
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/share/lintian/overrides/pipewire-pulse
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/share/man/man1/pipewire-pulse.1.gz
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/share/bash-completion/completions/wpctl
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/share/zsh/vendor-completions/_wpctl
      # Daemon-side plugin modules and the wireplumber library itself -
      # see gdm-packages' override-build above for why these are dead
      # weight without the daemon binaries, and why the client-facing
      # libpipewire-0.3.so/gstreamer/ALSA plugins are kept instead.
      rm -rf "${CRAFT_PART_INSTALL}"/base/usr/lib/*/wireplumber-0.5
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/lib/*/libwireplumber-0.5.so*
      rm -rf "${CRAFT_PART_INSTALL}"/base/usr/lib/*/pipewire-0.3
    override-prime: |
      # No files from this step in prime

  xdg-desktop-portal-patched:
    after:
      - gnome-desktop-components
    plugin: nil
    source: .
    build-packages:
      - bubblewrap
      - build-essential
      - curl
      - dpkg-dev
      - libflatpak-dev
      - libfuse3-dev
      - libgdk-pixbuf-2.0-dev
      - libgeoclue-2-dev
      - libglib2.0-dev
      - libgstreamer-plugins-base1.0-dev
      - libgudev-1.0-dev
      - libjson-glib-dev
      - libpipewire-0.3-dev
      - libsystemd-dev
      - meson
      - ninja-build
      - pkg-config
    override-build: |
      set -eu

      changelog="${CRAFT_STAGE}/base/usr/share/doc/xdg-desktop-portal/changelog.Debian.gz"
      version="$(gzip -dc "${changelog}" | sed -n '1s/^[^(]*(\([^)]*\)).*/\1/p')"
      if [ -z "${version}" ]; then
        echo "Could not determine the staged xdg-desktop-portal version" >&2
        exit 1
      fi

      source_version="$(printf '%s\n' "${version}" | cut -d- -f1)"
      source_url="https://archive.ubuntu.com/ubuntu/pool/main/x/xdg-desktop-portal"
      cd "${CRAFT_PART_BUILD}"
      curl --fail --location --silent --show-error \
        "${source_url}/xdg-desktop-portal_${version}.dsc" \
        --output "xdg-desktop-portal_${version}.dsc"
      curl --fail --location --silent --show-error \
        "${source_url}/xdg-desktop-portal_${source_version}.orig.tar.xz" \
        --output "xdg-desktop-portal_${source_version}.orig.tar.xz"
      curl --fail --location --silent --show-error \
        "${source_url}/xdg-desktop-portal_${version}.debian.tar.xz" \
        --output "xdg-desktop-portal_${version}.debian.tar.xz"

      source_dir="${CRAFT_PART_BUILD}/source"
      dpkg-source --extract "xdg-desktop-portal_${version}.dsc" "${source_dir}"
      patch --strip=1 --directory="${source_dir}" \
        < "${CRAFT_PART_SRC}/patches/xdg-desktop-portal-defer-optional-backend-activation.patch"

      build_dir="${CRAFT_PART_BUILD}/build"
      meson setup "${build_dir}" "${source_dir}" \
        --prefix=/usr \
        --libexecdir=libexec \
        -Ddocumentation=disabled \
        -Dflatpak-interfaces=enabled \
        -Dgeoclue=enabled \
        -Dgudev=enabled \
        -Dinstalled-tests=false \
        -Dman-pages=disabled \
        -Dsystemd=enabled \
        -Dtests=disabled
      meson compile -C "${build_dir}"
      install_root="${CRAFT_PART_BUILD}/install"
      DESTDIR="${install_root}" meson install --no-rebuild -C "${build_dir}"
      install -D -m 0755 \
        "${install_root}/usr/libexec/xdg-desktop-portal" \
        "${CRAFT_PART_INSTALL}/base/usr/libexec/xdg-desktop-portal"
    override-prime: |
      # No files from this step in prime; hooks flattens ${CRAFT_STAGE}/base.

  system-setup-tool-packages:
    # Packages for hooks/002.4-configure-system-setup-tool.chroot
    # (pre-chisel: apt-get install --no-install-recommends -y
    # gnome-initial-setup provd, run directly in that hook). We only
    # want gnome-initial-setup for its theming/dconf-defaults data and
    # provd for the whitelabel-configurable onboarding wizard; the
    # actual "run at first login" behaviour is disabled/removed by the
    # hook, in favour of the ubuntu-desktop-init snap.
    after:
      - chisel-libs
    plugin: nil
    stage-packages:
      - gnome-initial-setup
      - provd
    override-build: |
      # See desktop-packages' override-build above for why this
      # relocation is needed.
      tmpdir="$(mktemp -d)"
      mv "${CRAFT_PART_INSTALL}"/* "$tmpdir"/
      mkdir -p "${CRAFT_PART_INSTALL}"/base
      mv "$tmpdir"/* "${CRAFT_PART_INSTALL}"/base/
      rmdir "$tmpdir"

      # Resolve any overlap with chisel-libs (systemd units, coreutils,
      # etc.) - see tools/resolve-base-conflicts.sh.
      "${CRAFT_PROJECT_DIR}"/tools/resolve-base-conflicts.sh "${CRAFT_PART_INSTALL}"/base

      # See gdm-packages' override-build above for why this is needed.
      rm -f "${CRAFT_PART_INSTALL}"/base/etc/default/motd-news
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/lib/systemd/system/motd-news.service
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/lib/systemd/system/motd-news.timer
      rm -f "${CRAFT_PART_INSTALL}"/base/etc/update-motd.d/50-motd-news

      # gnome-initial-setup depends on gnome-shell (for its wizard UI),
      # which hard-depends on gstreamer1.0-pipewire -> pipewire, and
      # something in that chain also pulls in wireplumber - same
      # reasoning and cleanup as gdm-packages/gnome-desktop-components'
      # override-build for item 13 of the rebase: sessions bring their
      # own PipeWire via snap instead. No pipewire-bin here either, so
      # strip everything these packages ship.
      find "${CRAFT_PART_INSTALL}"/base/usr/bin -maxdepth 1 \
        \( -name 'pipewire*' -o -name 'pw-*' -o -name 'spa-*' \
           -o -name 'wireplumber' -o -name 'wpctl' -o -name 'wpexec' \) \
        -exec rm -f {} +
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/lib/systemd/user/pipewire*
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/lib/systemd/user/wireplumber*
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/lib/sysusers.d/pipewire.conf
      rm -rf "${CRAFT_PART_INSTALL}"/base/usr/share/wireplumber
      rm -rf "${CRAFT_PART_INSTALL}"/base/usr/share/pipewire
      rm -rf "${CRAFT_PART_INSTALL}"/base/usr/share/doc/pipewire
      rm -rf "${CRAFT_PART_INSTALL}"/base/usr/share/doc/pipewire-pulse
      rm -rf "${CRAFT_PART_INSTALL}"/base/usr/share/doc/wireplumber
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/share/apport/package-hooks/source_pipewire.py
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/share/glib-2.0/schemas/org.freedesktop.pulseaudio.gschema.xml
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/share/lintian/overrides/wireplumber
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/share/lintian/overrides/pipewire-pulse
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/share/man/man1/pipewire-pulse.1.gz
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/share/bash-completion/completions/wpctl
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/share/zsh/vendor-completions/_wpctl
      # Daemon-side plugin modules and the wireplumber library itself -
      # see gdm-packages' override-build above for why these are dead
      # weight without the daemon binaries, and why the client-facing
      # libpipewire-0.3.so/gstreamer/ALSA plugins are kept instead.
      rm -rf "${CRAFT_PART_INSTALL}"/base/usr/lib/*/wireplumber-0.5
      rm -f "${CRAFT_PART_INSTALL}"/base/usr/lib/*/libwireplumber-0.5.so*
      rm -rf "${CRAFT_PART_INSTALL}"/base/usr/lib/*/pipewire-0.3
    override-prime: |
      # No files from this step in prime

  locale-packages:
    # Packages for hooks/002.2-add-locales.chroot (pre-chisel: apt-get
    # install -y '^language-pack-gnome-[a-z]+-base$', run directly in
    # that hook). Snapcraft's stage-packages doesn't support apt's
    # regex-based package selection, so the full set of
    # language-pack-gnome-*-base packages (one per supported language)
    # is enumerated explicitly here instead - this is the full,
    # unabridged list from the noble/resolute archive.
    #
    # The hook itself only keeps a handful of .mo files per language
    # (the ones GNOME/GTK components actually use) and discards the
    # rest, so most of what's staged here is thrown away again at
    # hook-run time - that's expected, it mirrors the original apt-get
    # + hook-side pruning design exactly.
    after:
      - chisel-libs
    plugin: nil
    stage-packages:
      - language-pack-gnome-af-base
      - language-pack-gnome-am-base
      - language-pack-gnome-an-base
      - language-pack-gnome-ar-base
      - language-pack-gnome-as-base
      - language-pack-gnome-ast-base
      - language-pack-gnome-az-base
      - language-pack-gnome-be-base
      - language-pack-gnome-bg-base
      - language-pack-gnome-bn-base
      - language-pack-gnome-br-base
      - language-pack-gnome-bs-base
      - language-pack-gnome-ca-base
      - language-pack-gnome-ckb-base
      - language-pack-gnome-crh-base
