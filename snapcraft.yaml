name: core26
adopt-info: build-env
summary: Runtime environment based on Ubuntu 26.04
description: |
  The base snap based on the Ubuntu 26.04 release.
confinement: strict
type: base
build-base: core26
grade: stable
# The desktop variant builds amd64 and arm64 (native builds on the
# matching hosted runners; the payload's arch-specific ELFs are staged
# from archive debs / built from in-tree source per architecture — see
# the desktop-payload-debs and fuse-broker parts). Declaring the
# platforms makes a foreign-arch build fail loudly at build-plan
# computation instead of producing an amd64-assuming base;
# tools/build-variant.sh enforces the same declaration, earlier and
# with the build story attached. The arm64 content-snap closure
# expectations are documented in docs/arm64-recon.md.
platforms:
  amd64:
  arm64:
assumes:
  - snapd2.55.5
  # This is uncommented in our github builds for riscv64
  ## - isa-riscv64-rva23

parts:
  build-env:
    plugin: nil
    # To retrigger the pull step automatically on changes.
    source: .
    override-pull: |
      # We use a file with env vars in $CRAFT_PROJECT_DIR to decide whether to
      # include cloud-init or not. This file can be manually created for local
      # builds, or created here if we are running from a launchpad recipe with
      # suffix -cloud-init. This is detected by looking at the
      # SNAPCRAFT_IMAGE_INFO env var injected in LP, which tells us the build
      # url and has a form like:
      #
      # {
      #   "build-request-id": "lp-<id>",
      #   "build-request-timestamp": "<time>",
      #   "build_url": "https://launchpad.net/~ubuntu-core-service/+snap/core26-cloud-init/+build/<build_id>"
      # }
      #
      # (although in one line).
      if ! [ -e "$CRAFT_PROJECT_DIR"/build-env ]; then
        (
            cd "${CRAFT_PART_SRC}"
            touch build-env
            # parse the snap name from the url, and remove the prefix "core26-" and 
            # suffix "/+build" to get the variant name, if any.
            if [ -n "${SNAPCRAFT_IMAGE_INFO+x}" ]; then
              SNAP_BUILD_VARIANT=$(printf '%s' "$SNAPCRAFT_IMAGE_INFO" | grep -oP '(?<=core26-)[^/]*(?=/\+build)' || true)
              if [ -n "$SNAP_BUILD_VARIANT" ]; then
                  echo "SNAP_BUILD_VARIANT=$SNAP_BUILD_VARIANT" > build-env
              fi
            fi
        )
      else
        # copy to install dir so that we can use it in the build step
        cp "$CRAFT_PROJECT_DIR"/build-env "${CRAFT_PART_SRC}"/build-env
      fi

      date_tag=$("$CRAFT_PROJECT_DIR"/get-version.sh)

      # make sure we load the build-env here, especially if we're using
      # the locally sourced one.
      . "${CRAFT_PART_SRC}"/build-env
      SNAP_BUILD_VARIANT=${SNAP_BUILD_VARIANT:-}

      # handle build variants
      if [ -n "$SNAP_BUILD_VARIANT" ]; then
        craftctl set version="${date_tag}+$SNAP_BUILD_VARIANT"
        echo "SNAP_BUILD_NAME=core26-$SNAP_BUILD_VARIANT" >> "${CRAFT_PART_SRC}"/build-env
      else
        craftctl set version="${date_tag}"
        echo "SNAP_BUILD_NAME=core26" > "${CRAFT_PART_SRC}"/build-env
      fi
    override-build: |
      cp "${CRAFT_PART_SRC}"/build-env "${CRAFT_PART_INSTALL}"/build-env
    prime:
      - -build-env

  # TODO: rewrite this once all slices are upstreamed to use chisel slices
  # directly from canonical, instead of our own chisel-releases repo.
  chisel-libs:
    after:
      - build-env
    plugin: nil
    build-packages:
      - golang
      - file
    source: https://github.com/canonical/chisel-ubuntu-core.git
    source-type: git
    source-branch: '26.04'
    override-build: |
      go install github.com/canonical/chisel/cmd/chisel@latest
      
      # Define the system utilities that we want to include in the base
      # These are the ones where we can probably slim down the number of binaries
      # later on, but for now we include them all to ensure maximum compatibility.
      UTILS=(
        apparmor_bins
        bash_bins
        bzip2_scripts
        coreutils-from-uutils_bins
        diffutils_bins
        dosfstools_bins
        debianutils_which
        debianutils_ischroot
        debianutils_run-parts
        file_bins
        gdbserver_bins
        gnu-coreutils_bins
        gnutls-bin_bins
        gpgv_bins
        grep_bins
        gzip_scripts
        hostname_bins
        iptables_bins
        iputils-ping_bins
        less_bins
        login_bins
        mawk_bins
        ncurses-bin_bins
        polkitd_bins
        rfkill_bins
        sed_bins
        sudo-rs_bins
        sysvinit-utils_scripts
        squashfs-tools_bins
        tar_bins
        util-linux_bins
        util-linux_nsenter
        util-linux-extra_pivot-root
        util-linux-extra_hardware
        util-linux-extra_process
        util-linux-extra_login
        vim-tiny_bins
      )

      # Define the system libraries and services that we want to include in the base
      # 
      SLICES=(
        apparmor_systemd
        base-files_motd
        base-files_locale
        base-files_profile
        base-files_release-info
        base-files_root-defaults
        bash-completion_config
        bash-completion_completions
        ca-certificates_data-with-certs
        cracklib-runtime_bins
        cryptsetup_bins
        cryptsetup-bin_bins
        dbus_services
        dbus-user-session_services
        dhcpcd-base_standard
        distro-info-data_data
        dmsetup_rules
        e2fsprogs_services
        e2fsprogs_standard
        fdisk_bins
        fonts-ubuntu_all
        fonts-ubuntu_config
        finalrd_services
        iproute2_bins
        kmod_bins
        kmod_config

        libc6_config
        libc6_gconv
        libc-bin_iconv
        libc-bin_nsswitch
        libc-bin_ldconfig
        libc-bin_locale
        libc-bin_getconf
        libc-bin_getent

        libpam-modules_config
        libpam-modules_pam-config
        libpam-pwquality_pam-config
        libpam-modules-bin_standard
        libpam-modules-bin_extrausers
        libpam-modules-bin_namespace
        libpam-modules-bin_timestamp
        libpam-systemd_libs
        libengine-pkcs11-openssl_libs
        libgnutls30t64_config
        libopts25_libs
        libp11-3t64_libs
        libnss-mdns_mdns4-minimal
        libnss-extrausers_libs
        libpam-pwquality_libs
        libpciaccess0_libs
        libwrap0_host-files
        libx11-data_xerrordb
        locales_standard

        netcat-openbsd_bins
        netplan.io_bins
        ncurses-base_terminfo

        openssh-client_config
        openssh-client_services
        openssh-server_bins
        openssh-server_config
        openssh-server_services
        openssl_bins
        opensc_bins
        p11-kit_bins
        passwd_pam-config
        polkitd_services
        procps_bins
        plymouth_bins
        plymouth-label-ft_libs
        procps_config

        udev_services
        util-linux_services
        systemd_bash-completions
        systemd_extras
        systemd_run0
        systemd_kernel-parameters
        systemd_udev-rules
        systemd_tpm2
        systemd_standard
        systemd_user-services
        systemd-bootchart_services
        systemd-coredump_bins
        systemd-cryptsetup_bins
        systemd-cryptsetup_services
        systemd-resolved_bins
        systemd-sysv_bins
        systemd-timesyncd_services
        systemd-zram-generator_services
        
        tzdata_zoneinfo
        wpasupplicant_services
      )


      . "$CRAFT_STAGE"/build-env
      SNAP_BUILD_VARIANT=${SNAP_BUILD_VARIANT:-}
      if [ "$SNAP_BUILD_VARIANT" = cloud-init ]; then
          SLICES+=(cloud-init_bins)
      fi

      # TODO: not sure about FIPS yet, this will have to come later, chisel has builtin
      # support for ESM, meaning it's something we can request chisel to do for us.
      # if [ "$SNAP_BUILD_VARIANT" = fips ]; then
      #   # Ensure vital crypt packages are refreshed / downgraded and downloaded
      #   # from the FIPS ppa. This should also contain openssh-server, but we already
      #   # have that one listed above.
      #   SLICES+=(libgcrypt20 libgnutls30t64 openssl-fips-module-3 ssh)
      # fi
      
      # add architecture specific slices
      case "$(dpkg --print-architecture)" in
          amd64|arm64)
              SLICES+=(
                secureboot-db_services
                nvidia-kernel-common-595_bins
                nvidia-kernel-common-595_modprobe-d-kms
              )
              ;;
          i386)
              SLICES+=(secureboot-db_services)
              ;;
          riscv64)
              SLICES+=(gdbserver_bins systemd-bootchart_services)
              ;;
      esac

      # create the rootfs directory we install slices into
      mkdir -p "${CRAFT_PART_INSTALL}"/base

      # Cut the initial slices into the rootfs
      chisel cut \
        --release="${CRAFT_PART_SRC}" \
        --root "${CRAFT_PART_INSTALL}"/base \
        "${SLICES[@]}" "${UTILS[@]}" \
        base-files_chisel

      # Cut foreign libraries we also need
      case "$(dpkg --print-architecture)" in
          amd64)
              chisel cut \
                --arch=i386 \
                --release="${CRAFT_PART_SRC}" \
                --root "${CRAFT_PART_INSTALL}"/base \
                libnss-mdns_mdns4-minimal libc6_libs libc6_gconv libc6_config libgcc-s1_libs
              ;;
      esac

      # Derive changelog slices from the manifest to automatically cover
      # all packages, including their dependencies.
      CHANGELOG_SLICES=()
      python3 "${CRAFT_PROJECT_DIR}/tools/wall2dpkg.py" \
        "${CRAFT_PART_INSTALL}/base/var/lib/chisel/manifest.wall" \
        "${CRAFT_PART_BUILD}/dpkg-for-changelogs.yaml" 2>/dev/null || true

      while IFS='= ' read -r pkg _; do
          case "$pkg" in
              # Skip packages known to not have a changelog slice
              openssh-server |\
              kmod |\
              libatomic1 |\
              libgcc-s1 |\
              libncursesw6 |\
              libpython3.14-stdlib |\
              libstdc++6 |\
              openssh-sftp-server |\
              p11-kit-modules)
                  continue ;;
          esac
          CHANGELOG_SLICES+=("${pkg}_changelog")
      done < <(grep '^- ' "${CRAFT_PART_BUILD}/dpkg-for-changelogs.yaml" | sed 's/^- //')

      # We are sure to have changelog slices, it's likely a bug if there are
      # none.
      if [ ${#CHANGELOG_SLICES[@]} -eq 0 ]; then
          echo "No changelogs?"
          exit 1
      fi

      chisel cut \
          --release="${CRAFT_PART_SRC}" \
          --root "${CRAFT_PART_INSTALL}"/base \
          "${CHANGELOG_SLICES[@]}"

      # https://ubuntu.com/chisel/docs/latest/reference/manifest/
      # chisel automatically generates a manifest for the cut slices here:
      # $rootfs/var/lib/chisel/manifest.wall
      # this is zstd compressed, and must therefor be uncompressed
      # unzstd ./manifest.wall -o manifest.json

    override-prime: |
      # No files from this step in prime

  snapd-files:
    plugin: nil
    source: .
    build-packages:
      - snapd
    after:
      - chisel-libs
    override-build: |
      mkdir -p "${CRAFT_PART_INSTALL}"/base/usr/lib/systemd/system-generators
      cp /usr/lib/systemd/system-generators/snapd-generator "${CRAFT_PART_INSTALL}"/base/usr/lib/systemd/system-generators/snapd-generator
      mkdir -p "${CRAFT_PART_INSTALL}"/base/usr/lib/tmpfiles.d
      cp /usr/lib/tmpfiles.d/snapd.conf "${CRAFT_PART_INSTALL}"/base/usr/lib/tmpfiles.d/snapd.conf
    override-prime: |
      # No files from this step in prime

  generators:
    plugin: nil
    source: generators/
    build-packages:
      - cargo
      - rustc
    override-build: |
      cd "${CRAFT_PART_SRC}"
      cargo build --release
      strip target/release/ubuntu-core-generator
      mkdir -p "${CRAFT_PART_INSTALL}/usr/lib/core"
      install -m 755 target/release/ubuntu-core-generator \
        "${CRAFT_PART_INSTALL}/usr/lib/core/ubuntu-core-generator"

  splash-theme:
    plugin: dump
    source: https://github.com/snapcore/plymouth-theme-ubuntu-core.git
    source-type: git
    organize:
      ubuntu-core: usr/share/plymouth/themes/ubuntu-core
      copyright: usr/share/doc/plymouth-theme-ubuntu-core/copyright
    stage:
      - -README.md

  fuse-broker:
    # xdg-fuse-broker, built from the in-tree fuse-broker/ source at
    # build time on the build architecture (a native go build per
    # runner; no vendored ELF — see fuse-broker/README.md for
    # provenance, and session-brokers-style design notes at the top of
    # broker.go for why this broker exists). Desktop builds only: the
    # binary is the payload's privileged FUSE mount broker.
    after:
      - build-env
    plugin: nil
    source: fuse-broker/
    build-packages:
      - golang
    override-build: |
      craftctl default
      . "$CRAFT_STAGE"/build-env
      SNAP_BUILD_VARIANT=${SNAP_BUILD_VARIANT:-}
      if [ "$SNAP_BUILD_VARIANT" != desktop ]; then
        echo "I: not the desktop variant, not building xdg-fuse-broker"
        exit 0
      fi
      cd "${CRAFT_PART_SRC}"
      CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o xdg-fuse-broker .
      mkdir -p "${CRAFT_PART_INSTALL}/desktop-payload/usr/bin"
      install -m 755 xdg-fuse-broker \
        "${CRAFT_PART_INSTALL}/desktop-payload/usr/bin/xdg-fuse-broker"
    override-prime: |
      # No files from this step in prime; the payload is copied into the
      # rootfs by apply-variant-payload.sh (Makefile install target).

  desktop-payload-debs:
    # The desktop variant's arch-specific payload PAM/NSS modules,
    # staged from archive debs at build time instead of vendored
    # binaries (the maintainer-endorsed accountsservice-snap pattern:
    # real package consumption with recorded provenance). Every deb
    # resolves natively per build architecture, so the same part serves
    # the amd64 and the arm64 build, and the ELFs are staged at the
    # build architecture's real multiarch paths.
    #
    # Deliberately NOT stage-packages (the accountsservice-snap shape):
    # the variant must stay payload-identical to stock core26 for
    # non-desktop builds, and the rootfs's dependency closure comes
    # from the chisel slices — only the modules themselves are
    # consumed. The exact debs are downloaded unconditionally per
    # desktop build (no dependency closure) and version-tolerant,
    # tracking the archive like the chisel cut and the fat base's
    # ucd-ppa-overlays part ("unpinned on purpose"): nothing here is
    # patched, and the modules' interfaces (PAM module API, glibc NSS
    # ABI, libsystemd SONAME) are stable, so an archive update needs no
    # re-pin — the md5s of what was actually staged are recorded in the
    # primed provenance file, and the 995 hook test verifies the ELFs
    # landed. Guards below fail the build loudly on a wrong-arch or
    # wrong-source archive state instead of packing something broken.
    after:
      - build-env
    plugin: nil
    source: .
    override-build: |
      craftctl default
      . "$CRAFT_STAGE"/build-env
      SNAP_BUILD_VARIANT=${SNAP_BUILD_VARIANT:-}
      if [ "$SNAP_BUILD_VARIANT" != desktop ]; then
        echo "I: not the desktop variant, no payload ELFs to stage"
        exit 0
      fi
      set -e
      arch="$(dpkg --print-architecture)"
      triplet="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
      # e_machine bytes of a native ELF: 0x3e x86-64, 0xb7 aarch64
      case "$arch" in
          amd64) machine="3e00" ;;
          arm64) machine="b700" ;;
          *)
              echo "E: the desktop payload has no ELF machine mapping for" \
                  "$arch; extend this part (and snapcraft.yaml's platforms)" \
                  "together" >&2
              exit 1
              ;;
      esac

      workdir="${CRAFT_PART_BUILD}/debs"
      mkdir -p "$workdir"
      cd "$workdir"
      apt-get update
      # gdm3 ships pam_gdm.so; fprintd's PAM module is libpam-fprintd;
      # gnome-keyring's is libpam-gnome-keyring; the systemd pair comes
      # from one source package and must move together (guard below).
      apt-get download gdm3 libpam-fprintd libpam-gnome-keyring \
          libpam-systemd libnss-systemd

      # the systemd pair comes from one source package: a mismatched
      # pair would mean a partially-synced archive, refuse it
      ver_pam="$(dpkg-deb -f libpam-systemd_*.deb Version)"
      ver_nss="$(dpkg-deb -f libnss-systemd_*.deb Version)"
      if [ "$ver_pam" != "$ver_nss" ]; then
          echo "E: libpam-systemd ($ver_pam) and libnss-systemd" \
              "($ver_nss) are from the same source package but differ;" \
              "refusing to stage a partially-synced archive state" >&2
          exit 1
      fi

      payload="${CRAFT_PART_INSTALL}/desktop-payload"
      mkdir -p "$payload"
      provenance="$payload/usr/share/doc/desktop-payload/provenance"
      mkdir -p "$(dirname "$provenance")"
      {
          echo "Arch-specific desktop-variant payload ELFs, staged from"
          echo "archive debs at build time (snapcraft.yaml:" \
              "desktop-payload-debs)."
          echo "Build arch: $arch (triplet $triplet)"
          echo
      } > "$provenance"

      # <deb> <path-in-deb> <payload-destination> — extract, guard, record
      extract() {
          deb="$1"
          rel="$2"
          dst="$3"
          if [ "$(dpkg-deb -f "$deb" Architecture)" != "$arch" ]; then
              echo "E: $deb is not built for $arch" >&2
              exit 1
          fi
          rm -rf extract && mkdir extract
          dpkg-deb -x "$deb" extract
          src="extract/$rel"
          if ! [ -f "$src" ]; then
              echo "E: $deb does not ship $rel (package layout changed?)" >&2
              exit 1
          fi
          # ELF magic + native e_machine: a wrong-arch module here
          # would segfault the PAM stack at first login
          if [ "$(head -c 4 "$src" | od -An -tx1 | tr -d ' \n')" \
                  != "7f454c46" ] \
                  || [ "$(od -An -tx1 -j18 -N2 "$src" | tr -d ' \n')" \
                  != "$machine" ]; then
              echo "E: $src is not a native $arch ELF" >&2
              exit 1
          fi
          mkdir -p "$(dirname "$payload/$dst")"
          # the deb's own file mode (0644 for these shared objects)
          cp -a "$src" "$payload/$dst"
          echo "$(md5sum "$payload/$dst" | cut -d' ' -f1)  $dst" \
              "$(dpkg-deb -f "$deb" Package) $(dpkg-deb -f "$deb" Version)" \
              >> "$provenance"
          echo "I: staged $dst from $(basename "$deb")"
      }

      # pam_gdm.so: the deb ships it at the multiarch security path;
      # the payload keeps the arch-neutral /usr/lib/security/ location
      # the fat base used (libpam's module lookup falls back to it —
      # proven on the fat images; the gdm-* PAM stacks reference the
      # bare module name). Everything else keeps the deb's layout.
      extract gdm3_*.deb \
          "usr/lib/$triplet/security/pam_gdm.so" \
          "usr/lib/security/pam_gdm.so"
      extract libpam-fprintd_*.deb \
          "usr/lib/$triplet/security/pam_fprintd.so" \
          "usr/lib/$triplet/security/pam_fprintd.so"
      extract libpam-gnome-keyring_*.deb \
          "usr/lib/$triplet/security/pam_gnome_keyring.so" \
          "usr/lib/$triplet/security/pam_gnome_keyring.so"
      extract libpam-systemd_*.deb \
          "usr/lib/$triplet/security/pam_systemd_loadkey.so" \
          "usr/lib/$triplet/security/pam_systemd_loadkey.so"
      extract libnss-systemd_*.deb \
          "usr/lib/$triplet/libnss_systemd.so.2" \
          "usr/lib/$triplet/libnss_systemd.so.2"
      cat "$provenance"
    override-prime: |
      # No files from this step in prime; the payload is copied into the
      # rootfs by apply-variant-payload.sh (Makefile install target).

  hooks:
    after:
      - chisel-libs
      - snapd-files
      - splash-theme
      - fuse-broker
      - desktop-payload-debs
      - build-env
    plugin: make
    source: .
    build-packages:
      - shellcheck
      - distro-info
    override-prime: |
      craftctl default

      # ensure build-in tests are run
      make -C ${CRAFT_PART_SRC} test TESTDIR=${CRAFT_PRIME}

  generate-changelog:
    after:
      - hooks
    plugin: make
    # Use the root to be able to detect the git repo, as we need to be able
    # to get the current commit
    source: .
    build-packages:
      - python3-debian
      - python3-requests
      - python3-yaml
    # to generate changelogs, it's own snap need to be present
    # TODO: maybe we can override pull and just copy the files we need into
    # the source dir.
    build-snaps:
      - core26/beta
    override-build: |
      cd ${CRAFT_PART_SRC}

      # Generate the dpkg.yaml for compatability purposes. Scanning tools still expect
      # this file to be present, and they move slowly in terms of support for the new chisel format.
      mkdir -p "${CRAFT_PART_BUILD}/sysroot/usr/share/snappy"
      cp -avT "${CRAFT_STAGE}/base/usr/share/doc" "${CRAFT_PART_BUILD}/sysroot/usr/share/doc"
      python3 ./tools/wall2dpkg.py "${CRAFT_STAGE}/var/lib/chisel/manifest.wall" "${CRAFT_PART_BUILD}/sysroot/usr/share/snappy/dpkg.yaml"

      # When building through spread there is no .git, which means we cannot
      # generate the changelog in this case, ensure that the current folder is
      # a git repository, additionally check that the snap we are building a changelog
      # against has the dpkg.yaml.
      if git rev-parse HEAD && [ -e "/snap/core26/current/usr/share/snappy/dpkg.yaml" ]; then
        CHG_PARAMS=
        if [ -e /build/core26 ]; then
          CHG_PARAMS=--launchpad
        fi
        ./tools/generate-changelog.py "/snap/core26/current" "${CRAFT_PART_BUILD}/sysroot" core26 $CHG_PARAMS
        install -D "${CRAFT_PART_BUILD}/sysroot/usr/share/doc/ChangeLog" "${CRAFT_PART_INSTALL}/usr/share/doc/ChangeLog"
      else
        echo "WARNING: changelog will not be generated for this build"
      fi
      install -D "${CRAFT_PART_BUILD}/sysroot/usr/share/snappy/dpkg.yaml" "${CRAFT_PART_INSTALL}/usr/share/snappy/dpkg.yaml"

  publish-artifacts-lp:
    after:
      - generate-changelog
    plugin: nil
    override-prime: |
      # copy dpkg.yaml, chisel manifest and changelog files for lp build
      if [ -e /build/core26 ]; then
        DATEFMT="$(date +%Y%m%d%H%M)"
        /bin/cp ${CRAFT_PRIME}/usr/share/snappy/dpkg.yaml /build/core26/core26-$(DATEFMT)_${CRAFT_ARCH_BUILD_FOR}.dpkg.yaml
        /bin/cp ${CRAFT_PRIME}/var/lib/chisel/manifest.wall /build/core26/core26-$(DATEFMT)_${CRAFT_ARCH_BUILD_FOR}.manifest.wall
        /bin/cp ${CRAFT_PRIME}/usr/share/doc/ChangeLog /build/core26/core26-$(DATEFMT)_${CRAFT_ARCH_BUILD_FOR}.ChangeLog
      fi
