# Do not let sshd accept sessions before snapd has finished seeding.
#
# A login during first-boot seeding races snapd's per-user session
# agent: the agent socket (/run/user/<uid>/snapd-session-agent.socket)
# only exists while a session is open, and snapd manages user-scope
# snap services through it. A short-lived login that ends while a
# user-service operation is in flight makes the agent socket fail
# ("connection reset/refused"), which errors the seed change; the
# retry change then parks in Wait at the gadget's restart boundary and
# first boot never completes without a manual reboot.
#
# With this ordering, port 22 only starts answering once snapd.seeded
# is done: "ssh connects" implies "the system is seeded". Connections
# made before that are refused instead of accepted-but-racy. Deliberate
# consequences: dev images keep SSH fully enabled (they just answer
# later), and CI boot gates that wait for SSH absorb the seeding time
# in their SSH wait. Getty is deliberately NOT ordered the same way:
# serial-console root login must stay available for boot diagnosis.
[Unit]
After=snapd.seeded.service
