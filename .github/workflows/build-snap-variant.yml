name: build-snap-variant
# Builds the desktop VARIANT of the core26-desktop base snap
# (tools/build-variant.sh desktop) and publishes it for the
# ubuntu-core-desktop thin image CI to consume.
#
# Branch note: this workflow currently triggers on desktop/26-thin. The
# branch will be renamed to desktop/26 once the maintainer-runbook
# rename lands (the old fat desktop/26 CI in build-snap.yml is still
# live until then and publishes the FAT base to the desktop-26-latest
# release). The variant snap is therefore published to its own
# desktop-26-thin-latest release under the same asset name the fat CI
# uses (core26-desktop.snap): the two rolling releases can never clobber
# each other, and the image CI picks the thin one by tag. After the
# rename, change the trigger below to desktop/26; the fat build-snap.yml
# does not exist on this branch's history, so only this workflow runs.
#
# Variant switches need a snapcraft clean: cached part state re-applies
# the other variant's project_vars snapshot and clobbers the freshly set
# "+desktop" version (the cached-state quirk tools/build-variant.sh
# documents and works around). Hosted runners are fresh so there is
# normally nothing to clean; the explicit clean keeps this correct if
# the workflow ever moves to warm runners or gains a variant matrix.
on:
  pull_request:
  push:
    branches:
      - desktop/26-thin
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y fakeroot squashfs-tools
      - name: Set up LXD (mirrors snapcore/action-build)
        run: |
          sudo groupadd --force --system lxd
          sudo usermod --append --groups lxd "$USER"
          sudo snap install lxd
          sudo lxd init --auto
          # GH runners ship docker/moby, whose FORWARD DROP policy breaks
          # LXD bridge networking ("no network access" while creating the
          # build instance) - see snapcore/action-build ensureLXDNetwork.
          sudo iptables -P FORWARD ACCEPT
      - name: Build the desktop-variant core26-desktop snap
        run: |
          sudo snap install snapcraft --classic --channel=edge
          # Re-exec with fresh group membership so snapcraft/lxc can talk
          # to the LXD socket (see action-build's sudo -u "$USER" -E
          # pattern); build-variant.sh needs host-side lxc for its
          # in-instance repack step too.
          sudo -u "$USER" -E snapcraft clean || echo "nothing to clean (fresh runner)"
          sudo -u "$USER" -E ./tools/build-variant.sh desktop
      - name: Normalize snap filename
        run: cp "$(ls -t core26-desktop_*+desktop_*.snap | head -1)" core26-desktop.snap
      - name: Publish to desktop-26-thin-latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-26-thin-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create desktop-26-thin-latest -R "$GITHUB_REPOSITORY" \
                 --title "desktop/26-thin latest desktop-variant snap" \
                 --notes "Rolling latest desktop-variant core26-desktop build from desktop/26-thin; assets are replaced on every green build. Consumed by ubuntu-core-desktop's thin image CI until the desktop/26 rename lands."
          gh release upload desktop-26-thin-latest core26-desktop.snap -R "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: snap-desktop-variant
          path: core26-desktop.snap
          compression-level: 0
          retention-days: 14
