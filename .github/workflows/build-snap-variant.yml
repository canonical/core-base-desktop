name: build-snap-variant
# Builds the desktop VARIANT of the core26-desktop base snap
# (tools/build-variant.sh desktop) and publishes it for the
# ubuntu-core-desktop image CI to consume.
#
# Branch note: this workflow triggers on desktop/26, the project's live
# work branch. It became the desktop-variant branch on 2026-11-09 when
# the admin runbook landed and the branches were renamed: the old fat
# desktop/26 -> desktop/26-fat, the thin desktop/26-thin -> desktop/26,
# and desktop/26 became the default. The fat branch is retired: its
# build-snap.yml was removed on 2026-11-23 and the branch is kept as
# history only.
#
# Release note: this publishes to desktop-26-latest, the same rolling tag
# every other component repo uses. Until 2026-11-23 it published to
# desktop-26-thin-latest — a name left over from the rename, kept so the
# two rolling releases could never clobber each other. With the fat build
# retired there is nothing left to clobber, so the name is gone.
#
# Architecture matrix: the variant builds natively on each architecture
# (there is no cross-build — the chroot hooks and chisel slice
# resolution execute the build architecture's binaries, see
# docs/arm64-recon.md). amd64 keeps the asset name the image CI
# expects; arm64 gets a distinct -arm64 asset on the same release, the
# validated canonical/{fprintd,boltd,geoclue}-snap pattern. The
# payload's arch-specific ELFs are staged from archive debs / built
# from in-tree source per architecture (desktop-payload-debs and
# fuse-broker parts), so no per-arch payload prep is needed here.
#
# Variant switches need a snapcraft clean: cached part state re-applies
# the other variant's project_vars snapshot and clobbers the freshly set
# "+desktop" version (the cached-state quirk tools/build-variant.sh
# documents and works around). Hosted runners are fresh so there is
# normally nothing to clean; the explicit clean keeps this correct if
# the workflow ever moves to warm runners or gains a variant matrix.
on:
  pull_request:
  push:
    branches:
      - desktop/26
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snap:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-26.04
            asset: core26-desktop.snap
          - arch: arm64
            runs-on: ubuntu-26.04-arm
            asset: core26-desktop-arm64.snap
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y fakeroot squashfs-tools
      - name: Set up LXD (mirrors snapcore/action-build)
        run: |
          sudo groupadd --force --system lxd
          sudo usermod --append --groups lxd "$USER"
          sudo snap install lxd
          sudo lxd init --auto
          # GH runners ship docker/moby, whose FORWARD DROP policy breaks
          # LXD bridge networking ("no network access" while creating the
          # build instance) - see snapcore/action-build ensureLXDNetwork.
          sudo iptables -P FORWARD ACCEPT
      - name: Build the desktop-variant core26-desktop snap
        run: |
          sudo snap install snapcraft --classic --channel=edge
          # Re-exec with fresh group membership so snapcraft/lxc can talk
          # to the LXD socket (see action-build's sudo -u "$USER" -E
          # pattern); build-variant.sh needs host-side lxc for its
          # in-instance repack step too.
          sudo -u "$USER" -E snapcraft clean || echo "nothing to clean (fresh runner)"
          sudo -u "$USER" -E ./tools/build-variant.sh desktop
      - name: Normalize snap filename
        run: cp "$(ls -t core26-desktop_*+desktop_*.snap | head -1)" ${{ matrix.asset }}
      - name: Publish to desktop-26-latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-26-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create desktop-26-latest -R "$GITHUB_REPOSITORY" \
                 --title "desktop/26 latest desktop-variant snap" \
                 --notes "Rolling latest desktop-variant core26-desktop build from desktop/26; assets are replaced on every green build. Consumed by ubuntu-core-desktop's image CI. (Until 2026-11-23 this release was called desktop-26-thin-latest, a name kept from the 2026-11-09 branch rename so it could not clobber the fat branch's desktop-26-latest release.)"
          gh release upload desktop-26-latest ${{ matrix.asset }} -R "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v6
        with:
          name: snap-desktop-variant-${{ matrix.arch }}
          path: ${{ matrix.asset }}
          compression-level: 0
          retention-days: 14
